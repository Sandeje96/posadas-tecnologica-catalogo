{% extends 'base.html' %}

{% block title %}Iniciar Sesión — Mundolimp Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <!-- Card Header -->
                <div class="card-header text-center py-4 border-0 bg-primary text-white">
                    <div class="mb-2">
                        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Mundolimp" class="img-fluid" style="max-height: 80px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));">
                    </div>
                    <p class="text-white-50 mb-0 small">Panel de Administración</p>
                </div>

                <!-- Card Body -->
                <div class="card-body p-4 p-lg-5 bg-white">
                    <h5 class="fw-bold mb-4 text-center text-dark">
                        <i class="bi bi-lock-fill me-2 text-primary"></i>
                        Acceso Administrativo
                    </h5>

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center gap-2 mb-4 rounded-3 small" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold small text-dark">
                                Contraseña de Administrador
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-key-fill text-muted"></i>
                                </span>
                                <input
                                    type="password"
                                    class="form-control border-start-0 ps-0 rounded-end-3{% if error %} is-invalid{% endif %}"
                                    id="password"
                                    name="password"
                                    placeholder="Ingresa la contraseña"
                                    autocomplete="current-password"
                                    autofocus
                                    required
                                >
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-lg fw-bold btn-primary rounded-pill shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Ingresar al Panel
                            </button>
                        </div>
                    </form>

                    <div class="text-center mt-4">
                        <a href="{{ url_for('catalog.index') }}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i>
                            Volver al catálogo de clientes
                        </a>
                    </div>
                </div>
            </div>

            <p class="text-center mt-3 small text-muted">
                <i class="bi bi-shield-lock me-1"></i>
                Área de gestión para personal de Mundolimp
            </p>
        </div>
    </div>
</div>
{% endblock %}
